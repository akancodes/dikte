name: TestFlight testers

# Puts team members in TestFlight's internal group "Us" without building anything. The iOS workflow does the
# same after every upload with its own list; change both together.

on:
  workflow_dispatch:
    inputs:
      testers:
        description: First names of App Store Connect users, comma-separated
        default: Bayram, Ömer

permissions:
  contents: read

jobs:
  testers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Add them
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          TESTERS: ${{ inputs.testers }}
        run: |
          printf '%s\n' "$ASC_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
          node ios/scripts/asc.mjs testers "$RUNNER_TEMP/AuthKey.p8"
          rm -f "$RUNNER_TEMP/AuthKey.p8"
