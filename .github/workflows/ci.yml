name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet test tests/Dikte.Tests
      - run: dotnet publish src/Dikte -c Release -o dist
      - uses: actions/upload-artifact@v4
        with:
          name: Dikte-windows
          path: dist/Dikte.exe

  mac:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: swift --version
      - run: swift test --package-path mac
      - run: mac/build-app.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Dikte-mac
          path: dist/Dikte-mac.zip

  # A merge to main that raises <Version> in the csproj is a release: the apps update themselves from it.
  # (A v* tag pushed by hand still works.) Tags made here with GITHUB_TOKEN start no second run.
  version:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      new: ${{ steps.v.outputs.new }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then tag="$GITHUB_REF_NAME"
          else tag="v$(sed -n 's|.*<Version>\(.*\)</Version>.*|\1|p' src/Dikte/Dikte.csproj)"; fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then new=false; else new=true; fi
          echo "new=$new" >> "$GITHUB_OUTPUT"
          echo "$tag: new release = $new"

  release:
    if: needs.version.outputs.new == 'true'
    needs: [version, windows, mac]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          gh release create "$TAG" dist/Dikte.exe dist/Dikte-mac.zip \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Dikte ${TAG#v}" --generate-notes
