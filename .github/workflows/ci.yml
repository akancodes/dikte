name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet test tests/Dikte.Tests
      - run: dotnet publish src/Dikte -c Release -o dist
      - uses: actions/upload-artifact@v4
        with:
          name: Dikte-windows
          path: dist/Dikte.exe

  mac:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: swift --version
      - run: swift test --package-path mac
      - run: mac/build-app.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Dikte-mac
          path: dist/Dikte-mac.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, mac]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/Dikte.exe dist/Dikte-mac.zip \
            --repo "$GITHUB_REPOSITORY" --title "Dikte ${GITHUB_REF_NAME#v}" --generate-notes
