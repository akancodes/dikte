name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet test tests/Dikte.Tests
      - run: dotnet publish src/Dikte -c Release -o dist
      - uses: actions/upload-artifact@v4
        with:
          name: Dikte
          path: dist/Dikte.exe
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: gh release create "$GITHUB_REF_NAME" dist/Dikte.exe --title "Dikte ${GITHUB_REF_NAME#v}" --generate-notes
